# Perfil para desarrollo local ÚNICAMENTE.
# Activar con: -Dspring.profiles.active=local  (o SPRING_PROFILES_ACTIVE=local)
# NO usar en producción ni en staging.
#
# Todas las variables sensibles (claves, credenciales, seeders) se inyectan desde
# .env.local vía docker-compose.local.yml (env_file). application.properties (base)
# ya declara los placeholders ${APP_ENCRYPTION_KEY}, ${APP_JWT_SECRET}, etc.; aquí
# sólo sobreescribimos lo que difiere del perfil por defecto o que necesita un valor
# real en local (DB_URL con el host del contenedor postgres-local).

# Clave AES-256 (placeholder ya declarado en application.properties: ${APP_ENCRYPTION_KEY}).
# Local dev: definida en .env.local como APP_ENCRYPTION_KEY.

# PostgreSQL local — docker-compose.local.yml inyecta DB_URL apuntando a postgres-local.
# Los defaults apuntan a localhost:5432 para poder correr sin Docker (IDE), pero dentro
# del contenedor el env var DB_URL sobreescribe este valor.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trazzo_dev_db}
spring.datasource.username=${DB_USER:trazzo_dev}
spring.datasource.password=${DB_PASSWORD:trazzo_dev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Admin seeder: only active with local profile + explicit opt-in.
# Credentials provistas por .env.local (TRAZZO_SEED_ADMIN_*).
trazzo.seed.admin.enabled=true
trazzo.seed.admin.email=${TRAZZO_SEED_ADMIN_EMAIL:admin@trazzo.pe}
trazzo.seed.admin.password=${TRAZZO_SEED_ADMIN_PASSWORD:}

# Demo tenant seeder: creates a "demo" tenant + PostgreSQL schema on local startup
# so organization/corehr/incidents can be exercised without manual provisioning.
# Credentials provistas por .env.local (TRAZZO_SEED_TENANT_DEMO_* / USUARIO_*).
trazzo.seed.tenant.enabled=true
trazzo.seed.tenant.sub-domain=demo
trazzo.seed.tenant.demo.email=${TRAZZO_SEED_TENANT_DEMO_EMAIL:demo@trazzo.pe}
trazzo.seed.tenant.demo.password=${TRAZZO_SEED_TENANT_DEMO_PASSWORD:}
trazzo.seed.tenant.usuario.email=${TRAZZO_SEED_TENANT_USUARIO_EMAIL:usuario@trazzo.pe}
trazzo.seed.tenant.usuario.password=${TRAZZO_SEED_TENANT_USUARIO_PASSWORD:}

# JWT secret (placeholder ya declarado en application.properties: ${APP_JWT_SECRET}).
# Local dev: definida en .env.local como APP_JWT_SECRET.
app.jwt.expiration-ms=86400000

# ddl-auto se deja en "none" (default de Spring Boot para una BD no embebida): las
# tablas de organization/corehr/incidents las crea el provisioning de tenant
# (db/tenant/V1__tenant_db.sql) en el schema de cada tenant, no Hibernate.
# Resend (transactional email): placeholders ya declarados en application.properties
# como ${RESEND_API_KEY:} y ${RESEND_FROM_EMAIL:}. Aquí sólo aseguramos que los env
# vars RESEND_API_KEY / RESEND_FROM (usado por ResendEmailAdapter) tengan un sane
# binding en local usando los defaults.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

# Cloudflare R2 (S3-compatible) — credenciales del entorno DEV (cuenta R2 dev).
# El .env.local puebla estas variables. Si el endpoint queda vacío, Spring activa
# LocalStorageStub (no hay R2 configurado) en lugar del adapter real.
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.region=${CLOUDFLARE_R2_REGION:auto}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:trazzo-dev}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}
