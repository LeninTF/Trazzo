spring.application.name=back
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# AES-256-GCM key for encrypting tenant DB passwords (Base64-encoded 32 bytes).
# Production/CI: set APP_ENCRYPTION_KEY environment variable.
# Local dev: run with -Dspring.profiles.active=local (see application-local.properties).
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Master DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/master_db}
spring.datasource.username=${DB_USER:trazzo_app}
# Set via env var DB_PASSWORD (local dev: use -Dspring.profiles.active=local)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool of the master DataSource (the only physical pool; tenant schemas share it).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=trazzo-master

# Timestamps are written and read in UTC regardless of the JVM/DB session timezone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Graceful shutdown: finish in-flight requests (up to 30s) before the container's stop_grace_period.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.connection-timeout=20s

# Hibernate DDL auto: disabled; tenant schemas are managed by V1 + TenantSchemaMigrator.
spring.jpa.hibernate.ddl-auto=none

# Flyway: migraciones del master DB (db/migration/V*__*.sql)
spring.flyway.locations=classpath:db/master
spring.session.jdbc.initialize-schema=never

# Per-tenant schema migrations (db/tenant/migration, Flyway, history in flyway_tenant_history).
# false: a failing tenant is logged with its stack trace and the app still boots, reporting
# OUT_OF_SERVICE on the tenantMigrations health contributor. true (local, tests) aborts startup.
trazzo.tenant-migrations.fail-on-error=${TENANT_MIGRATIONS_FAIL_ON_ERROR:false}

# Cloudflare R2 (S3-compatible)
# Empty defaults allow the app to start without R2 configured (local dev).
# When the endpoint is blank, storage beans are not created.
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.region=${CLOUDFLARE_R2_REGION:}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# Mercado Pago Suscripciones (Preapproval API)
# Empty defaults allow the app to start without it configured (local dev without a token).
# webhook-secret is blank until the notification URL is configured in the MP dashboard —
# MercadoPagoWebhookController must reject all notifications while it's blank, never process
# unsigned/unverifiable webhooks even in dev.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# required=true (default) makes StartupConfigValidator refuse to boot outside the local profile
# when the token or webhook secret is missing. use-sandbox must stay false outside local.
mercadopago.required=${MERCADOPAGO_REQUIRED:true}
mercadopago.use-sandbox=${MERCADOPAGO_USE_SANDBOX:false}
# Where Mercado Pago's hosted checkout redirects the payer's browser back to after a
# preapproval is authorized (back_url). Must be https; defaults to the frontend URL.
mercadopago.back-url=${MERCADOPAGO_BACK_URL:${app.frontend-url}}

# Public URL of the Angular frontend. No default: StartupConfigValidator requires it (https)
# outside the local profile.
app.frontend-url=${FRONTEND_URL:}

# /shop trial tenants that never get their payment confirmed by Mercado Pago are purged this
# many hours after creation, on this cron schedule (default: hourly).
trazzo.shop.abandoned-trial-hours=${ABANDONED_TRIAL_HOURS:1}
trazzo.shop.abandoned-trial-cleanup-cron=${ABANDONED_TRIAL_CLEANUP_CRON:0 0 * * * *}

# DataSeeder also requires @Profile("local") to be instantiated at all, so this is inert
# unless SPRING_PROFILES_ACTIVE=local is set — kept false here as defense in depth against
# that ever happening by mistake in a real deploy. application-local.properties sets it to
# true for local dev.
trazzo.seed.admin.enabled=false

# Tenant seeder credentials (demo + usuario). Inert in prod (see @Profile("local") and
# trazzo.seed.tenant.enabled above). When running locally, application-local.properties
# sets the demo/usuario email+password. In any non-local environment these should be
# provided via environment variables to avoid committing credentials.
trazzo.seed.admin.email=${TRAZZO_SEED_ADMIN_EMAIL:}
trazzo.seed.admin.password=${TRAZZO_SEED_ADMIN_PASSWORD:}
trazzo.seed.tenant.demo.email=${TRAZZO_SEED_TENANT_DEMO_EMAIL:}
trazzo.seed.tenant.demo.password=${TRAZZO_SEED_TENANT_DEMO_PASSWORD:}
trazzo.seed.tenant.usuario.email=${TRAZZO_SEED_TENANT_USUARIO_EMAIL:}
trazzo.seed.tenant.usuario.password=${TRAZZO_SEED_TENANT_USUARIO_PASSWORD:}

# JWT: secret HMAC-256 en Base64 (mínimo 32 bytes). Production: set APP_JWT_SECRET env var.
# Local dev: agregar app.jwt.secret=<valor> en application-local.properties
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Resend (transactional email): no Trazzo account exists yet, so this is intentionally left
# unset. ResendEmailAdapter logs a warning and skips sending when the key is blank, rather
# than failing the request/comment operation that triggered the notification.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:notificaciones@trazzo.pe}
trazzo.requests.notification-email=${REQUESTS_NOTIFICATION_EMAIL:solicitudes@trazzo.pe}

# Server context path
server.servlet.context-path=/api/v1

# Management server port (for actuator endpoints). Solo expone 'health' (por seguridad); el
# puerto 8081 no se publica, solo lo alcanzan los healthchecks dentro de la red de Docker.

management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
