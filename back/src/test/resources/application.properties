spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Clave AES-256 de prueba (32 bytes de 0x01; solo para tests, no usar en produccion)
app.encryption.key=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

# Flyway y Spring Session deshabilitados en tests (DataSource es mock, no hay BD real)
spring.flyway.enabled=false
spring.session.store-type=none

# JWT: secret HMAC-256 en Base64. Fallback seguro de 32 bytes para tests (solo tests, no usar en produccion).
app.jwt.secret=${APP_JWT_SECRET:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
app.jwt.expiration-ms=86400000

# Cloudflare R2 (valores dummy para tests de contexto Spring)
cloudflare.r2.endpoint=http://localhost:9000
cloudflare.r2.region=auto
cloudflare.r2.access-key-id=test-key
cloudflare.r2.secret-access-key=test-secret
cloudflare.r2.bucket-name=test-bucket
cloudflare.r2.public-url=http://localhost:9000/test-bucket

# Frontend y Mercado Pago de prueba: cumplen StartupConfigValidator (https, sin sandbox, no requerido).
app.frontend-url=https://test.trazzo.local
mercadopago.required=false
mercadopago.use-sandbox=false
mercadopago.back-url=https://test.trazzo.local
