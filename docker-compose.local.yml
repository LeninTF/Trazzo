# Uso: docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
# --env-file es necesario para la interpolacion ${VAR} de este fichero (compose solo lee
# .env por defecto) y para resolver las variables del backend, que se listan una a una.
# Plantilla de variables: .env.local.example
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  trazzo-backend:
    # 1. build para compilar localmente
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: trazzo-backend-local
    # 2. Exponemos el puerto para que el frontend local pueda hablarle
    ports:
      - "8080:8080"
    # Lista explicita (no env_file): el contenedor no recibe el resto de .env.local, como la contrasena
    # del superusuario. Las claves sin valor se toman de .env.local si estan definidas; si no, rige el
    # default de application-local.properties / application.properties.
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - TZ=UTC
      # Como en prod: el backend conecta con el rol de la app (APP_DB_*), nunca con el superusuario.
      - DB_URL=jdbc:postgresql://postgres-local:5432/${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4000}
      - ABANDONED_TRIAL_HOURS=${ABANDONED_TRIAL_HOURS:-1}
      - ABANDONED_TRIAL_CLEANUP_CRON=${ABANDONED_TRIAL_CLEANUP_CRON:-0 0 * * * *}
      # Clave RSA biometrica persistente entre reinicios (como en prod).
      - APP_BIOMETRIC_RSA_KEY_FILE=/app/keys/biometric-rsa.pem
      - APP_BIOMETRIC_RSA_PRIVATE_KEY
      - APP_BIOMETRIC_RSA_PREVIOUS_KEYS
      - APP_BIOMETRIC_STORAGE_KEY
      - APP_JWT_SECRET
      - APP_ENCRYPTION_KEY
      - APP_TIMEZONE
      - DB_POOL_MAX
      - TENANT_MIGRATIONS_FAIL_ON_ERROR
      - MERCADOPAGO_REQUIRED
      - MERCADOPAGO_USE_SANDBOX
      - MERCADOPAGO_BACK_URL
      - CLOUDFLARE_R2_ENDPOINT
      - CLOUDFLARE_R2_ACCESS_KEY_ID
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY
      - CLOUDFLARE_R2_BUCKET_NAME
      - CLOUDFLARE_R2_REGION
      - CLOUDFLARE_R2_PUBLIC_URL
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - REQUESTS_NOTIFICATION_EMAIL
      - TRAZZO_SEED_ADMIN_EMAIL
      - TRAZZO_SEED_ADMIN_PASSWORD
      - TRAZZO_SEED_TENANT_DEMO_EMAIL
      - TRAZZO_SEED_TENANT_DEMO_PASSWORD
      - TRAZZO_SEED_TENANT_USUARIO_EMAIL
      - TRAZZO_SEED_TENANT_USUARIO_PASSWORD
    volumes:
      - trazzo-backend-keys-local:/app/keys
    # Margen sobre spring.lifecycle.timeout-per-shutdown-phase (30s) antes del SIGKILL.
    stop_grace_period: 40s
    networks:
      - trazzo-local-net
    logging: *default-logging
    depends_on:
      postgres-local:
        condition: service_healthy
      trazzo-db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  trazzo-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: trazzo-frontend-local
    # 3. Exponemos el puerto 8080 hacia tu localhost:4000
    ports:
      - "4000:8080"
    networks:
      - trazzo-local-net
    logging: *default-logging
    depends_on:
      trazzo-backend:
        condition: service_healthy

  # Incluimos la BD aquí para que el backend contenedorizado tenga donde conectarse
  postgres-local:
    image: postgres:15-alpine
    container_name: trazzo-db-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - trazzo-local-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: reaplica el init (rol de la app, BD, grants, timezone UTC) por TCP en cada `up`.
  trazzo-db-bootstrap:
    image: postgres:15-alpine
    container_name: trazzo-db-bootstrap-local
    restart: "no"
    environment:
      PGHOST: postgres-local
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init:/init:ro
    command: ["sh", "/init/01-init-master-db.sh"]
    networks:
      - trazzo-local-net
    logging: *default-logging
    depends_on:
      postgres-local:
        condition: service_healthy

networks:
  trazzo-local-net:
    driver: bridge

volumes:
  trazzo-backend-keys-local:
