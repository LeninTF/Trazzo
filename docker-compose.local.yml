# Uso: docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
# --env-file es necesario para la interpolacion ${VAR} de este fichero (compose solo lee
# .env por defecto); env_file: de cada servicio inyecta .env.local dentro del contenedor.
# Plantilla de variables: .env.local.example
services:
  trazzo-backend:
    # 1. build para compilar localmente
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: trazzo-backend-local
    # 2. Exponemos el puerto para que el frontend local pueda hablarle
    ports:
      - "8080:8080"
    # Inyecta TODAS las variables necesarias (.env.local) en el entorno del contenedor.
    # application.properties / application-local.properties referencian cada una via ${VAR}
    # para que Spring las levante. Las variables que requieren override del host de compose
    # (p.ej. DB_URL apuntando a postgres-local en vez de localhost) se redefinen abajo.
    env_file:
      - .env.local
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - TZ=UTC
      # Como en prod: el backend conecta con el rol de la app (APP_DB_*), nunca con el superusuario.
      - DB_URL=jdbc:postgresql://postgres-local:5432/${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4000}
      - ABANDONED_TRIAL_HOURS=${ABANDONED_TRIAL_HOURS:-1}
      - ABANDONED_TRIAL_CLEANUP_CRON=${ABANDONED_TRIAL_CLEANUP_CRON:-0 0 * * * *}
    # Margen sobre spring.lifecycle.timeout-per-shutdown-phase (30s) antes del SIGKILL.
    stop_grace_period: 40s
    networks:
      - trazzo-local-net
    depends_on:
      postgres-local:
        condition: service_healthy
      trazzo-db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  trazzo-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: trazzo-frontend-local
    # 3. Exponemos el puerto 8080 hacia tu localhost:4000
    ports:
      - "4000:8080"
    networks:
      - trazzo-local-net
    depends_on:
      trazzo-backend:
        condition: service_healthy

  # Incluimos la BD aquí para que el backend contenedorizado tenga donde conectarse
  postgres-local:
    image: postgres:15-alpine
    container_name: trazzo-db-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - trazzo-local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: reaplica el init (rol de la app, BD, grants, timezone UTC) por TCP en cada `up`.
  trazzo-db-bootstrap:
    image: postgres:15-alpine
    container_name: trazzo-db-bootstrap-local
    restart: "no"
    environment:
      PGHOST: postgres-local
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init:/init:ro
    command: ["sh", "/init/01-init-master-db.sh"]
    networks:
      - trazzo-local-net
    depends_on:
      postgres-local:
        condition: service_healthy

networks:
  trazzo-local-net:
    driver: bridge
