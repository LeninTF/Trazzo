openapi: 3.1.0
info:
  title: Trazzo · SaaS Global API
  description: |
    Contrato de la API del módulo **SaaS Global**: gestión de Holdings, Plans,
    Features, Tenants y Subscriptions desde el panel administrativo Trazzo.

    ## Base de datos
    Todas las operaciones de este módulo operan sobre `master_db`.

    ## Autenticación
    Todas las rutas requieren un JWT Bearer válido. Las rutas de administración
    (`/saas/*`, `/tenants/*`, `/subscriptions/*`) requieren rol `ADMIN_SAAS`.

    ## Prefijos
    | Prefijo              | Contexto                  | Base de datos |
    |----------------------|---------------------------|---------------|
    | `/auth`              | Autenticación general     | —             |
    | `/tenants`           | Aprovisionamiento         | `master_db`   |
    | `/subscriptions`     | Gestión de suscripciones  | `master_db`   |
    | `/saas/holdings`     | Gestión de Holdings       | `master_db`   |
    | `/saas/plans`        | Catálogo de planes        | `master_db`   |
    | `/saas/features`     | Catálogo de features      | `master_db`   |
  version: 3.1.0
  contact:
    name: Equipo Trazzo
servers:
  - url: https://trazzosaas.noahtechperu.com/api/v1
    description: Produccion (la API se sirve bajo /api del frontend)
  - url: http://localhost:8080/api/v1
    description: Local (docker-compose.local.yml)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT generado por Spring Boot. Payload relevante:
        - `sub`: ID del usuario Trazzo
        - `tenant_id`: null para usuarios MASTER
        - `context`: `MASTER`

  parameters:
    HoldingId:
      name: id
      in: path
      required: true
      description: ID único del holding.
      schema:
        type: integer
        example: 1

    PlanId:
      name: id
      in: path
      required: true
      description: ID único del plan.
      schema:
        type: integer
        example: 1

    FeatureId:
      name: id
      in: path
      required: true
      description: ID único de la feature.
      schema:
        type: integer
        example: 1

    TenantId:
      name: id
      in: path
      required: true
      description: UUID único del tenant.
      schema:
        type: string
        format: uuid
        example: "a1b2c3d4-0000-0000-0000-000000000001"

    SubscriptionId:
      name: id
      in: path
      required: true
      description: UUID único de la suscripción.
      schema:
        type: string
        format: uuid
        example: "b2c3d4e5-0000-0000-0000-000000000002"

  schemas:
    # ── Requests ──────────────────────────────────────────────────────────────
    HoldingRequest:
      type: object
      required: [taxId, legalName, type]
      properties:
        taxId:
          type: string
          description: RUC del holding (único globalmente).
          example: "20123456789"
        legalName:
          type: string
          description: Razón social.
          example: "Empresa SAC"
        type:
          type: string
          enum: [PUBLICO, PRIVADO]
          description: Naturaleza jurídica del holding.
          example: "PRIVADO"

    UpdateHoldingRequest:
      type: object
      required: [legalName, type]
      properties:
        legalName:
          type: string
          description: Nueva razón social del holding.
          example: "Empresa SAC Actualizada"
        type:
          type: string
          enum: [PUBLICO, PRIVADO]
          example: "PRIVADO"

    FeatureRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Biometric Access"
        description:
          type: [string, "null"]
          example: "Autenticación por huella digital"

    UpdateFeatureRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Biometric Access v2"
        description:
          type: [string, "null"]
          example: "Autenticación por huella digital mejorada"

    CreatePlanRequest:
      type: object
      required: [name, price, currency, billingPeriod]
      properties:
        name:
          type: string
          example: "Enterprise"
        price:
          type: number
          format: double
          minimum: 0
          example: 299.00
        currency:
          type: string
          enum: [SOLES, DOLAR, EURO]
          example: "SOLES"
        billingPeriod:
          type: string
          enum: [MONTHLY, ANNUAL]
          example: "MONTHLY"

    UpdatePlanRequest:
      type: object
      required: [name, price, currency, billingPeriod]
      properties:
        name:
          type: string
          example: "Enterprise Plus"
        price:
          type: number
          format: double
          minimum: 0
          example: 399.00
        currency:
          type: string
          enum: [SOLES, DOLAR, EURO]
          example: "SOLES"
        billingPeriod:
          type: string
          enum: [MONTHLY, ANNUAL]
          example: "ANNUAL"

    TenantTrialRequest:
      type: object
      required: [subDomain, planId, holdingId, dbHost, dbPort, dbName, dbUser, dbPassword]
      properties:
        subDomain:
          type: string
          description: Slug único del tenant.
          example: "mi-empresa"
        planId:
          type: integer
          example: 1
        holdingId:
          type: integer
          example: 1
        dbHost:
          type: string
          example: "db.ejemplo.com"
        dbPort:
          type: string
          example: "5432"
        dbName:
          type: string
          example: "trazzo_tenant_mi_empresa"
        dbUser:
          type: string
          example: "tenant_user"
        dbPassword:
          type: string
          format: password
        logoUrl:
          type: [string, "null"]
          format: uri
        slogan:
          type: [string, "null"]
          example: "Conectando personas"
        primaryColor:
          type: [string, "null"]
          example: "#3B82F6"
        secondaryColor:
          type: [string, "null"]
          example: "#1D4ED8"

    # ── Responses ─────────────────────────────────────────────────────────────
    AuthMeResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "admin@trazzo.pe"
        roles:
          type: array
          items:
            type: string
          example: ["ROLE_ADMIN_SAAS"]

    HoldingResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        taxId:
          type: string
          example: "20123456789"
        legalName:
          type: string
          example: "Empresa SAC"
        type:
          type: string
          enum: [PUBLICO, PRIVADO]
          example: "PRIVADO"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlanResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Basic"
        price:
          type: number
          format: double
          example: 99.00
        currency:
          type: string
          enum: [SOLES, DOLAR, EURO]
          example: "SOLES"
        billingPeriod:
          type: string
          enum: [MONTHLY, ANNUAL]
          example: "MONTHLY"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    FeatureResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Biometric Access"
        description:
          type: [string, "null"]
          example: "Autenticación por huella digital"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantTrialResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-0000-0000-0000-000000000001"
        subDomain:
          type: string
          example: "mi-empresa"
        planId:
          type: integer
          example: 1
        activated:
          type: boolean
          example: false
        activatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resource not found"
        status:
          type: integer
          example: 404
    PlanResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        price:
          type: number
        priceAnnual:
          type: number
        currency:
          type: string
        billingPeriod:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        features:
          type: object
          additionalProperties: {}
    SubmitRequestRequest:
      type: object
      required:
        - type
        - name
        - lastName
        - email
        - phoneNumber
        - taxId
        - companyName
        - message
      properties:
        type:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        taxId:
          type: string
          minLength: 1
        companyName:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    RequestResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contact:
          $ref: '#/components/schemas/RequestContactResult'
    RequestContactResult:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        taxId:
          type: string
        companyName:
          type: string
    InvoiceResult:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        invoiceSeries:
          type: string
        consecutiveNumber:
          type: string
        voucherType:
          type: string
        clientTaxId:
          type: string
        clientName:
          type: string
        subTotal:
          type: number
        taxAmount:
          type: number
        total:
          type: number
        paymentStatus:
          type: string
        expirationDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    RequestDetailResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contact:
          $ref: '#/components/schemas/RequestContactResult'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/RequestCommentResult'
        history:
          type: array
          items:
            $ref: '#/components/schemas/RequestRecordResult'
    RequestCommentResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        comment:
          type: string
        authorUserId:
          type: string
        createdAt:
          type: string
          format: date-time
    RequestRecordResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
        userId:
          type: string
        changeReason:
          type: string
        createdAt:
          type: string
          format: date-time
    ChangeRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          minLength: 1
        comment:
          type: string
    AddRequestCommentRequest:
      type: object
      required:
        - comment
      properties:
        comment:
          type: string
          minLength: 1
    SaasRoleResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        systemManaged:
          type: boolean
    CreateRoleRequest:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        description:
          type: string
    UpdateRoleRequest:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        description:
          type: string
    UpdateRolePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    TenantResult:
      type: object
      properties:
        id:
          type: string
        subDomain:
          type: string
        holdingId:
          type: integer
          format: int32
        holdingName:
          type: string
        planId:
          type: integer
          format: int32
        planName:
          type: string
        status:
          type: string
        activatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    TenantMetricsResult:
      type: object
      properties:
        total:
          type: integer
          format: int64
        crecimientoPct:
          type: number
        activos:
          type: integer
          format: int64
        porcentajeActivos:
          type: number
        nuevos30d:
          type: integer
          format: int64
        nuevosMeta:
          type: integer
          format: int32
        tasaChurnPct:
          type: number
        variacionChurnPct:
          type: number
    UpdateTenantBrandingRequest:
      type: object
      properties:
        logoUrl:
          type: string
        slogan:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
    ShopCheckoutRequest:
      type: object
      required:
        - planId
        - firstName
        - lastNamePaterno
        - lastNameMaterno
        - documentType
        - documentNumber
        - email
        - phone
        - ruc
        - companyName
        - businessName
      properties:
        planId:
          type: integer
          format: int32
        firstName:
          type: string
          minLength: 1
        lastNamePaterno:
          type: string
          minLength: 1
        lastNameMaterno:
          type: string
          minLength: 1
        documentType:
          type: string
          minLength: 1
        documentNumber:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
        ruc:
          type: string
          minLength: 1
        companyName:
          type: string
          minLength: 1
        businessName:
          type: string
          minLength: 1
        address:
          type: string
        anotherAdmin:
          type: boolean
        adminFirstName:
          type: string
        adminLastNamePaterno:
          type: string
        adminLastNameMaterno:
          type: string
        adminDocumentType:
          type: string
        adminDocumentNumber:
          type: string
        adminEmail:
          type: string
        adminPhone:
          type: string
    ShopCheckoutResponse:
      type: object
      properties:
        tenantId:
          type: string
        subDomain:
          type: string
        initPoint:
          type: string
    SubscriptionResult:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        planId:
          type: integer
          format: int32
        planName:
          type: string
        dateStart:
          type: string
          format: date
        dateEnd:
          type: string
          format: date
        status:
          type: string
        purchasePrice:
          type: number
        createdAt:
          type: string
          format: date-time
    SubscribeRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: integer
          format: int32
    SubscribeResponse:
      type: object
      properties:
        subscriptionId:
          type: string
        initPoint:
          type: string

security:
  - bearerAuth: []

paths:
  # ----------------------------------------
  # Autenticación
  # ----------------------------------------
  /auth/me:
    get:
      tags:
        - Autenticación
      summary: Datos del usuario autenticado
      description: |
        Devuelve el email y roles del JWT sin consultar la base de datos.
        Válido en contexto MASTER y TENANT.

        **Permisos requeridos:** cualquier usuario autenticado del tenant.
      responses:
        "200":
          description: Datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        "401":
          description: Token JWT inválido o expirado.

  # ----------------------------------------
  # Tenants
  # ----------------------------------------
  /tenants/trial:
    post:
      tags:
        - Tenants
      summary: Crear tenant en modo trial
      description: |
        Provisiona un nuevo tenant de forma atómica:
        1. Crea el registro en `master_db`
        2. Aprovisiona el schema de base de datos dedicado
        3. Configura branding inicial
        4. Activa la suscripción al plan indicado

        Si cualquier paso falla, se hace rollback completo.

        **Requiere rol:** `ADMIN_SAAS`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantTrialRequest'
      responses:
        "201":
          description: Tenant creado y aprovisionado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTrialResponse'
        "400":
          description: Datos inválidos o subdominio ya registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
        "403":
          description: Sin permiso para crear tenants.

  /saas/holdings:
    get:
      tags:
        - Holdings
      summary: Listar holdings
      description: |
        Devuelve todos los holdings no eliminados de `master_db`.
        **Requiere rol:** `ADMIN_SAAS`
      responses:
        "200":
          description: Lista de holdings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        "401":
          description: Token JWT inválido o expirado.
        "403":
          description: Sin permiso de acceso.
    post:
      tags:
        - Holdings
      summary: Crear holding
      description: |
        Registra una empresa holding. El `taxId` (RUC) debe ser único globalmente.
        **Requiere rol:** `ADMIN_SAAS`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingRequest'
      responses:
        "201":
          description: Holding creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        "400":
          description: RUC duplicado o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
        "403":
          description: Sin permiso para crear holdings.

  /saas/holdings/{id}:
    get:
      tags:
        - Holdings
      summary: Obtener holding por ID
      parameters:
        - $ref: '#/components/parameters/HoldingId'
      responses:
        "200":
          description: Datos del holding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        "404":
          description: Holding no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
    put:
      tags:
        - Holdings
      summary: Actualizar holding
      description: |
        Actualiza la razón social y el tipo del holding.
        El `taxId` (RUC) no es modificable.
        **Requiere rol:** `ADMIN_SAAS`
      parameters:
        - $ref: '#/components/parameters/HoldingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHoldingRequest'
      responses:
        "200":
          description: Holding actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        "400":
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Holding no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
    delete:
      tags:
        - Holdings
      summary: Eliminar holding (baja lógica)
      description: |
        Marca el holding como eliminado (`deleted_at = NOW()`) y lo desactiva.
        No elimina el registro físicamente.
        **Requiere rol:** `ADMIN_SAAS`
      parameters:
        - $ref: '#/components/parameters/HoldingId'
      responses:
        "204":
          description: Holding eliminado exitosamente.
        "404":
          description: Holding no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.

  /saas/holdings/{id}/activate:
    put:
      tags:
        - Holdings
      summary: Activar holding
      description: Reactiva un holding previamente desactivado.
      parameters:
        - $ref: '#/components/parameters/HoldingId'
      responses:
        "200":
          description: Holding activado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        "404":
          description: Holding no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.

  /saas/holdings/{id}/deactivate:
    put:
      tags:
        - Holdings
      summary: Desactivar holding
      description: Marca el holding como inactivo (baja lógica, no elimina).
      parameters:
        - $ref: '#/components/parameters/HoldingId'
      responses:
        "200":
          description: Holding desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        "404":
          description: Holding no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.

  # ----------------------------------------
  # Plans
  # ----------------------------------------
  /saas/plans:
    get:
      tags:
        - Plans
      summary: Listar todos los planes
      description: Catálogo completo de planes de suscripción.
      responses:
        "200":
          description: Lista de planes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'
        "401":
          description: Token JWT inválido o expirado.
    post:
      tags:
        - Plans
      summary: Crear plan
      description: |
        Registra un nuevo plan de suscripción en el catálogo.
        El nombre debe ser único globalmente.
        **Requiere rol:** `ADMIN_SAAS`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        "201":
          description: Plan creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        "400":
          description: Nombre duplicado o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
        "403":
          description: Sin permiso para crear planes.

  /saas/plans/active:
    get:
      tags:
        - Plans
      summary: Listar planes activos
      description: |
        Solo planes con `active = true`. Usado en el flujo de alta de tenants
        para mostrar las opciones disponibles al cliente.
      responses:
        "200":
          description: Lista de planes activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'
        "401":
          description: Token JWT inválido o expirado.

  /saas/plans/{id}:
    get:
      tags:
        - Plans
      summary: Obtener plan por ID
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        "200":
          description: Datos del plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        "404":
          description: Plan no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
    put:
      tags:
        - Plans
      summary: Actualizar plan
      description: |
        Actualiza nombre, precio, moneda y periodo de facturación.
        **Requiere rol:** `ADMIN_SAAS`
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        "200":
          description: Plan actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        "400":
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Plan no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.
    delete:
      tags:
        - Plans
      summary: Eliminar plan (baja lógica)
      description: |
        Marca el plan como eliminado y lo desactiva.
        No elimina el registro físicamente para preservar la integridad de suscripciones existentes.
        **Requiere rol:** `ADMIN_SAAS`
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        "204":
          description: Plan eliminado exitosamente.
        "404":
          description: Plan no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.

  /saas/plans/{id}/activate:
    put:
      tags:
        - Plans
      summary: Activar plan
      description: Reactiva un plan previamente desactivado.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        "200":
          description: Plan activado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        "404":
          description: Plan no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Token JWT inválido o expirado.

  /saas/plans/{id}/deactivate:
    put:
      tags:
        - Plans
      summary: Desactivar plan
      description: |
        Marca el plan como inactivo. Los tenants con suscripción activa
        no se ven afectados inmediatamente.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        "200":
          description: Plan desactivado.
