# Cache-Control por ruta con un solo add_header en el server: un add_header dentro de un location anula
# todos los heredados, y con ellos las cabeceras de seguridad. En /api se deja el del backend (un valor
# vacio no se envia).
map $uri $trazzo_cache_control {
    ~^/api/          "";
    ~*\.(?:css|js)$  "public, immutable";
    # index.html (y el resto) sin cache: los usuarios reciben siempre la ultima version de la app.
    default          "no-store, no-cache, must-revalidate";
}

server {
    listen 8080;
    server_name trazzosaas.noahtechperu.com;

    # /tmp ya existe con permisos 1777 (world-writable) en cualquier imagen
    # base, incluida la usada por el chequeo de sintaxis en CI sin build
    # propio y en runtime no-root: nginx puede crear estas rutas sin mkdir
    # ni chown adicionales. No se anida en /tmp/nginx porque nginx -t no
    # crea directorios intermedios (solo el nivel hoja).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;
    root /usr/share/nginx/html;
    index index.html;

    # Compresion Gzip para mejorar el rendimiento de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    add_header Cache-Control $trazzo_cache_control;

    # Cabeceras de seguridad (AUD-20), tambien en las respuestas de error (always).
    # CSP segun lo que carga la app: bundles propios sin scripts inline; estilos inline porque Angular
    # inyecta los de cada componente; imagenes data:/blob: (foto de perfil, evidencias) y https: (avatares
    # por URL); la API es del mismo origen (proxy /api/); ws://localhost:9001 es el agente del lector y
    # *.r2.cloudflarestorage.com recibe el PUT de las evidencias.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' ws://localhost:9001 https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Sin includeSubDomains: otros subdominios del dominio no tienen por que servir HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cache a largo plazo para archivos estaticos (js, css); el Cache-Control inmutable lo pone el map.
    location ~* \.(?:css|js)$ {
        expires 1y;
    }

    # Reenvia las llamadas del frontend al backend dentro de la red de Docker.
    location /api/ {
        # 1. Le decimos a Nginx que use el DNS interno de Docker para resolver nombres
        resolver 127.0.0.11 valid=30s;

        # 2. Guardamos la URL en una variable (esto evita el crash en el arranque/CI)
        set $upstream_back http://trazzo-backend:8080;

        # 3. Pasamos la variable
        proxy_pass $upstream_back;

        proxy_http_version 1.1;

        # Timeouts provisionales (H-031): 120s cubre operaciones largas del backend
        # hasta que se definan limites por endpoint.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las pone el server: sin repetir las mismas de Spring Security.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Redireccion SPA: Si el archivo o directorio no existe, redirigir a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
