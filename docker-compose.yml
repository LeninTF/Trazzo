# Logs de Docker acotados por servicio: sin esto json-file crece sin limite en el host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  trazzo-db:
    image: postgres:15-alpine
    container_name: trazzo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - trazzo-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trazzo-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: reaplica el init (rol de la app, BD, grants, timezone UTC) por TCP en cada
  # `up`. docker-entrypoint-initdb.d solo corre con el volumen vacio, asi que sin esto un
  # volumen existente nunca recibe los cambios del script.
  trazzo-db-bootstrap:
    image: postgres:15-alpine
    container_name: trazzo-db-bootstrap
    restart: "no"
    environment:
      PGHOST: trazzo-db
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init:/init:ro
    command: ["sh", "/init/01-init-master-db.sh"]
    networks:
      - trazzo-network
    logging: *default-logging
    depends_on:
      trazzo-db:
        condition: service_healthy

  trazzo-db-ssh:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls238
    container_name: trazzo-db-ssh
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      USER_NAME: ${SSH_USERNAME}
      PUBLIC_KEY: ${SSH_PUBLIC_KEY}
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - "2222:2222"
    networks:
      - trazzo-network
    logging: *default-logging
    depends_on:
      trazzo-db:
        condition: service_healthy

  trazzo-backend:
    # 1. Se descarga la imagen del registro.
    image: ghcr.io/lenintf/trazzo/trazzo-back:main
    container_name: trazzo-backend
    pull_policy: always
    restart: unless-stopped
    # Lista explicita (no env_file): el contenedor no recibe el resto de .env, como la contrasena del
    # superusuario. Las claves sin valor se toman de .env si estan definidas; si no, rige el default de
    # application.properties (por eso las opcionales van comentadas en .env.example, no vacias).
    environment:
      DB_URL: jdbc:postgresql://trazzo-db:5432/${APP_DB_NAME}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
      # Clave RSA biometrica persistente (se genera la primera vez). APP_BIOMETRIC_RSA_PRIVATE_KEY
      # en .env, si se define, tiene prioridad sobre este archivo.
      APP_BIOMETRIC_RSA_KEY_FILE: /app/keys/biometric-rsa.pem
      APP_BIOMETRIC_RSA_PRIVATE_KEY:
      APP_BIOMETRIC_RSA_PREVIOUS_KEYS:
      APP_BIOMETRIC_STORAGE_KEY:
      APP_JWT_SECRET:
      APP_ENCRYPTION_KEY:
      APP_TIMEZONE:
      FRONTEND_URL:
      DB_POOL_MAX:
      TENANT_MIGRATIONS_FAIL_ON_ERROR:
      MERCADOPAGO_ACCESS_TOKEN:
      MERCADOPAGO_PUBLIC_KEY:
      MERCADOPAGO_WEBHOOK_SECRET:
      MERCADOPAGO_REQUIRED:
      MERCADOPAGO_USE_SANDBOX:
      MERCADOPAGO_BACK_URL:
      ABANDONED_TRIAL_HOURS:
      ABANDONED_TRIAL_CLEANUP_CRON:
      CLOUDFLARE_R2_ENDPOINT:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
      CLOUDFLARE_R2_BUCKET_NAME:
      CLOUDFLARE_R2_REGION:
      CLOUDFLARE_R2_PUBLIC_URL:
      RESEND_API_KEY:
      RESEND_FROM_EMAIL:
      REQUESTS_NOTIFICATION_EMAIL:
      TRAZZO_SEED_ADMIN_EMAIL:
      TRAZZO_SEED_ADMIN_PASSWORD:
      TRAZZO_SEED_TENANT_DEMO_EMAIL:
      TRAZZO_SEED_TENANT_DEMO_PASSWORD:
      TRAZZO_SEED_TENANT_USUARIO_EMAIL:
      TRAZZO_SEED_TENANT_USUARIO_PASSWORD:
    volumes:
      - trazzo-backend-keys:/app/keys
    # Margen sobre spring.lifecycle.timeout-per-shutdown-phase (30s) antes del SIGKILL.
    stop_grace_period: 40s
    networks:
      - trazzo-network
    logging: *default-logging
    depends_on:
      trazzo-db:
        condition: service_healthy
      trazzo-db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  trazzo-frontend:
    image: ghcr.io/lenintf/trazzo/trazzo-front:main
    container_name: trazzo-frontend
    pull_policy: always
    restart: unless-stopped
    networks:
      - trazzo-network
    logging: *default-logging
    depends_on:
      trazzo-backend:
        condition: service_healthy # Espera a que Spring Boot este 100% arriba para iniciar

  # Ingreso por Cloudflare Tunnel: solo con el perfil (docker compose --profile tunnel up -d).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: trazzo-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: # Token del tunel (Cloudflare), en .env
    networks:
      - trazzo-network
    depends_on:
      - trazzo-frontend
    logging: *default-logging

networks:
  trazzo-network:
    driver: bridge

volumes:
  trazzo-postgres-data:
  # Clave RSA biometrica: perderla deja indescifrables los templates enrolados. Respaldarla junto con la BD.
  trazzo-backend-keys:
