                  updatedAt: "2026-05-20T09:00:00"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Crear rol
      description: |
        **Permisos requeridos:** solo `administrador_tenant`.
      operationId: createRole
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "Supervisor de RRHH"
              description: "Supervisa los procesos de selección y evaluación"
      responses:
        "201":
          description: Rol creado exitosamente.
          content:
