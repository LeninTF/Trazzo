  /org/departments:
    get:
      summary: Listar departamentos
      description: |
        Retorna todos los departamentos del tenant. Filtrable por área con
        `areaId` o por estado con `active`.

        **Permisos requeridos:** `VER_ESTRUCTURA` (`administrador_tenant` siempre pasa).
      operationId: listDepartments
      tags: [Departments]
      parameters:
        - name: areaId
          in: query
          required: false
          description: Filtra departamentos pertenecientes a un área específica.
          schema:
            type: integer
            example: 2
        - name: active
          in: query
          required: false
          description: Si es `true`, retorna solo departamentos con `state = true`.
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de departamentos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentResponse'
              example:
                - id: 3
                  areaId: 2
                  name: "Selección de Personal"
                  description: "Reclutamiento y evaluación de candidatos"
                  state: true
                  createdAt: "2026-02-01T08:00:00"
                  updatedAt: "2026-06-15T14:00:00"
                  deletedAt: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Crear departamento
      description: |
        Registra un nuevo departamento asociado a un área. El nombre debe ser
        único dentro del mismo área.

        **Permisos requeridos:** `estructura-organizacional.crear-editar-areas` (`administrador_tenant` siempre
        pasa).
      operationId: createDepartment
      tags: [Departments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
            example:
              areaId: 2
              name: "Selección de Personal"
              description: "Reclutamiento y evaluación de candidatos"
      responses:
        "201":
          description: Departamento creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: El área referenciada (`areaId`) no existe.
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /org/departments/{id}:
    get:
      summary: Obtener departamento por ID
      description: |
        **Permisos requeridos:** `VER_ESTRUCTURA` (`administrador_tenant` siempre pasa).
      operationId: getDepartmentById
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        "200":
          description: Datos del departamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
