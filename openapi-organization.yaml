          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar departamento
      description: |
        **Permisos requeridos:** `estructura-organizacional.crear-editar-areas` (`administrador_tenant` siempre
        pasa).
      operationId: updateDepartment
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
            example:
              name: "Reclutamiento Avanzado"
              description: "Evaluación técnica y cultural de candidatos"
      responses:
        "200":
          description: Departamento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Eliminar departamento (soft delete)
      description: |
        Marca el departamento como eliminado (`state = false`, `deleted_at = now`).

        **Permisos requeridos:** `estructura-organizacional.crear-editar-areas` (`administrador_tenant` siempre
        pasa).
      operationId: deleteDepartment
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        "204":
          description: Departamento eliminado exitosamente.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /org/roles:
    get:
      summary: Listar roles
