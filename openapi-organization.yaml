openapi: 3.1.0
info:
  title: Trazzo · Organization API
  description: |
    Contrato de la API del módulo **Organization**: gestión de la jerarquía
    organizacional (Branches, Areas, Departments) y control de accesos basado
    en roles (Roles, Permissions, asignaciones) dentro de un tenant Trazzo.

    ## Base de datos
    Todas las operaciones de este módulo operan sobre `tenant_db` (base de datos
    del tenant autenticado). El tenant se resuelve automáticamente desde el JWT.

    ## Autenticación
    Todas las rutas requieren un JWT Bearer válido con contexto `TENANT`.
    Las rutas de administración requieren rol `ADMIN`.

    ## Prefijos
    | Prefijo               | Contexto                            | Base de datos |
    |-----------------------|-------------------------------------|---------------|
    | `/org/branches`       | Gestión de sucursales               | `tenant_db`   |
    | `/org/areas`          | Gestión de áreas                    | `tenant_db`   |
    | `/org/departments`    | Gestión de departamentos            | `tenant_db`   |
    | `/org/roles`          | Catálogo de roles RBAC              | `tenant_db`   |
    | `/org/permissions`    | Catálogo de permisos RBAC           | `tenant_db`   |
    | `/org/users`          | Asignaciones usuario-org y usuario-rol | `tenant_db` |

    ## Jerarquía
    ```
    Branch (Sucursal)
    └── Area
        └── Department
    ```
    Un `tenant_user` pertenece a uno o más `department`, y recibe `role`s con
    sus `permissions` asociados.

  version: 1.0.0
  contact:
    name: Equipo Trazzo
servers:
  - url: https://trazzosaas.noahtechperu.com/api/v1
    description: Produccion (la API se sirve bajo /api del frontend)
  - url: http://localhost:8080/api/v1
    description: Local (docker-compose.local.yml)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT generado por Spring Boot. Payload relevante:
        - `sub`: ID del usuario Trazzo
        - `tenant_id`: UUID del tenant activo
        - `context`: `TENANT`

  parameters:
    BranchId:
      name: id
      in: path
      required: true
      description: ID único de la sucursal.
      schema:
        type: integer
        example: 1

    AreaId:
      name: id
      in: path
      required: true
      description: ID único del área.
      schema:
        type: integer
        example: 1

    DepartmentId:
      name: id
      in: path
      required: true
      description: ID único del departamento.
      schema:
        type: integer
        example: 1

    RoleId:
      name: id
      in: path
      required: true
      description: UUID único del rol.
      schema:
        type: string
        format: uuid
        example: "c1d2e3f4-0000-0000-0000-000000000001"

    PermissionId:
      name: id
      in: path
      required: true
      description: UUID único del permiso.
      schema:
        type: string
        format: uuid
        example: "d2e3f4a5-0000-0000-0000-000000000002"

    RoleIdPath:
      name: roleId
      in: path
      required: true
      description: UUID del rol al que pertenece el permiso.
      schema:
        type: string
        format: uuid
        example: "c1d2e3f4-0000-0000-0000-000000000001"

    PermissionIdPath:
      name: permissionId
      in: path
      required: true
      description: UUID del permiso a asignar o remover.
      schema:
        type: string
        format: uuid
        example: "d2e3f4a5-0000-0000-0000-000000000002"

    TenantUserId:
      name: tenantUserId
      in: path
      required: true
      description: ID del usuario del tenant.
      schema:
        type: integer
        example: 10

    DepartmentAssignmentId:
      name: assignmentId
      in: path
      required: true
      description: ID de la asignación usuario-departamento (`tenant_user_department.id`).
      schema:
        type: integer
        example: 5

    UserRoleAssignmentId:
      name: assignmentId
      in: path
      required: true
      description: ID de la asignación usuario-rol (`tenant_user_role.id`).
      schema:
        type: integer
        example: 3

  schemas:
    # ── Requests ──────────────────────────────────────────────────────────────

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre único de la sucursal dentro del tenant.
          example: "Sede Central Lima"
        description:
          type: ["string", "null"]
          description: Descripción opcional de la sucursal.
          example: "Oficina principal ubicada en Miraflores"

    UpdateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nuevo nombre de la sucursal.
          example: "Sede Central Lima – Renovada"
        description:
          type: ["string", "null"]
          description: Nueva descripción de la sucursal.
          example: "Oficina renovada en San Isidro"

    CreateAreaRequest:
      type: object
      required: [branchId, name]
      properties:
        branchId:
          type: integer
          description: ID de la sucursal a la que pertenece el área.
          example: 1
        name:
          type: string
          maxLength: 255
          description: Nombre del área. Único dentro de la sucursal.
          example: "Recursos Humanos"
        description:
          type: ["string", "null"]
          description: Descripción opcional del área.
          example: "Gestión del talento y bienestar laboral"

    UpdateAreaRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nuevo nombre del área.
          example: "Talento Humano"
        description:
          type: ["string", "null"]
          description: Nueva descripción del área.
          example: "Reclutamiento y desarrollo organizacional"

    CreateDepartmentRequest:
      type: object
      required: [areaId, name]
      properties:
        areaId:
          type: integer
          description: ID del área a la que pertenece el departamento.
          example: 2
        name:
          type: string
          maxLength: 255
          description: Nombre del departamento. Único dentro del área.
          example: "Selección de Personal"
        description:
          type: ["string", "null"]
          description: Descripción opcional del departamento.
          example: "Reclutamiento y evaluación de candidatos"

    UpdateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nuevo nombre del departamento.
          example: "Reclutamiento Avanzado"
        description:
          type: ["string", "null"]
          description: Nueva descripción del departamento.
          example: "Evaluación técnica y cultural de candidatos"

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Nombre del rol.
          example: "Supervisor de RRHH"
        description:
          type: ["string", "null"]
          description: Descripción del rol y sus responsabilidades.
          example: "Supervisa los procesos de selección y evaluación"

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Nuevo nombre del rol.
          example: "Jefe de RRHH"
        description:
          type: ["string", "null"]
          description: Nueva descripción del rol.
          example: "Responsable del área de recursos humanos"

    CreatePermissionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Nombre del permiso (acción sobre recurso).
          example: "employees:read"
        description:
          type: ["string", "null"]
          description: Descripción de lo que autoriza el permiso.
          example: "Ver listado y detalle de empleados"
        masterFeaturesCode:
          type: ["string", "null"]
          maxLength: 100
          description: |
            Código de la feature de master_db que habilita este permiso.
            Si está vacío, el permiso está disponible en todos los planes.
          example: "BIOMETRIC_MODULE"

    UpdatePermissionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Nuevo nombre del permiso.
          example: "employees:write"
        description:
          type: ["string", "null"]
          description: Nueva descripción del permiso.
          example: "Crear y editar registros de empleados"
        masterFeaturesCode:
          type: ["string", "null"]
          maxLength: 100
          description: Nuevo código de feature asociado.
          example: "ADVANCED_REPORTS"

    # ── Responses ─────────────────────────────────────────────────────────────

    BranchResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Sede Central Lima"
        description:
          type: ["string", "null"]
          example: "Oficina principal ubicada en Miraflores"
        state:
          type: boolean
          description: true = activa, false = inactiva (soft-deleted).
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T08:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-01T10:30:00"
        deletedAt:
          type: ["string", "null"]
          format: date-time
          example: null

    AreaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 2
        branchId:
          type: integer
          description: ID de la sucursal a la que pertenece.
          example: 1
        name:
          type: string
          example: "Recursos Humanos"
        description:
          type: ["string", "null"]
          example: "Gestión del talento y bienestar laboral"
        state:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-01-20T09:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T11:00:00"
        deletedAt:
          type: ["string", "null"]
          format: date-time
          example: null

    DepartmentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 3
        areaId:
          type: integer
          description: ID del área a la que pertenece.
          example: 2
        name:
          type: string
          example: "Selección de Personal"
        description:
          type: ["string", "null"]
          example: "Reclutamiento y evaluación de candidatos"
        state:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-02-01T08:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-15T14:00:00"
        deletedAt:
          type: ["string", "null"]
          format: date-time
          example: null

    RoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "c1d2e3f4-0000-0000-0000-000000000001"
        name:
          type: string
          example: "Supervisor de RRHH"
        description:
          type: ["string", "null"]
          example: "Supervisa los procesos de selección y evaluación"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-10T07:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-20T09:00:00"

    PermissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d2e3f4a5-0000-0000-0000-000000000002"
        name:
          type: string
          example: "employees:read"
        description:
          type: ["string", "null"]
          example: "Ver listado y detalle de empleados"
        masterFeaturesCode:
          type: ["string", "null"]
          example: "BIOMETRIC_MODULE"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-10T07:00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-20T09:00:00"

    AssignRoleToUserRequest:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
          description: UUID del rol a asignar al usuario.
          example: "c1d2e3f4-0000-0000-0000-000000000001"
        departmentId:
          type: ["integer", "null"]
          description: |
            ID del departamento que limita el scope del rol.
            Si es null, el rol aplica a todo el tenant.
          example: 3

    UserRoleAssignmentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 3
        tenantUserId:
          type: integer
          example: 10
        roleId:
          type: string
          format: uuid
          example: "c1d2e3f4-0000-0000-0000-000000000001"
        departmentId:
          type: ["integer", "null"]
          description: Scope del rol. Null si aplica a todo el tenant.
          example: 3
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T08:00:00"

    # ── Errores ───────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    AssignPermissionRequest:
      type: object
      required:
        - permissionId
      properties:
        permissionId:
          type: string
          minLength: 1
    RolePermissionResult:
      type: object
      properties:
        roleId:
          type: string
        permissionId:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Token JWT ausente, expirado o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-06-27T10:00:00"
            status: 401
            error: "Unauthorized"
            message: "JWT token is missing or invalid"
            path: "/api/v1/org/branches"

    Forbidden:
      description: El usuario no tiene el rol requerido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-06-27T10:00:00"
            status: 403
            error: "Forbidden"
            message: "Access denied"
            path: "/api/v1/org/branches"

    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-06-27T10:00:00"
            status: 404
            error: "Not Found"
            message: "Resource not found with id: 99"
            path: "/api/v1/org/branches/99"

    BadRequest:
      description: Datos de entrada inválidos o restricción de negocio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-06-27T10:00:00"
            status: 400
            error: "Bad Request"
            message: "name must not be blank"
            path: "/api/v1/org/branches"

    Conflict:
      description: Violación de restricción de unicidad (nombre duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-06-27T10:00:00"
            status: 409
            error: "Conflict"
            message: "A resource with this name already exists"
            path: "/api/v1/org/branches"

security:
  - bearerAuth: []

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ============================================================================
  # BRANCHES (Sucursales)
  # ============================================================================

  /org/branches:
    get:
      summary: Listar sucursales
      description: |
        Retorna todas las sucursales del tenant, incluyendo inactivas.
        Para filtrar solo las activas usar el parámetro `active=true`.

        **Permisos requeridos:** `VER_ESTRUCTURA` (`administrador_tenant` siempre pasa).
      operationId: listBranches
      tags: [Branches]
      parameters:
        - name: active
          in: query
          required: false
          description: Si es `true`, retorna solo sucursales con `state = true`.
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de sucursales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchResponse'
              example:
                - id: 1
                  name: "Sede Central Lima"
                  description: "Oficina principal en Miraflores"
                  state: true
                  createdAt: "2026-01-15T08:00:00"
                  updatedAt: "2026-06-01T10:30:00"
                  deletedAt: null
                - id: 2
                  name: "Sede Arequipa"
                  description: null
                  state: false
                  createdAt: "2026-02-10T09:00:00"
                  updatedAt: "2026-05-20T08:00:00"
                  deletedAt: "2026-05-20T08:00:00"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Crear sucursal
      description: |
        Registra una nueva sucursal para el tenant. El nombre debe ser único
        dentro del tenant.

        **Permisos requeridos:** `estructura-organizacional.crear-editar-sedes` (`administrador_tenant` siempre
        pasa).
      operationId: createBranch
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
            example:
              name: "Sede Central Lima"
              description: "Oficina principal ubicada en Miraflores"
      responses:
        "201":
          description: Sucursal creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
              example:
                id: 1
                name: "Sede Central Lima"
                description: "Oficina principal ubicada en Miraflores"
                state: true
                createdAt: "2026-06-27T10:00:00"
                updatedAt: "2026-06-27T10:00:00"
                deletedAt: null
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /org/branches/{id}:
    get:
      summary: Obtener sucursal por ID
      description: |
        **Permisos requeridos:** `VER_ESTRUCTURA` (`administrador_tenant` siempre pasa).
      operationId: getBranchById
      tags: [Branches]
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        "200":
          description: Datos de la sucursal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
              example:
                id: 1
                name: "Sede Central Lima"
                description: "Oficina principal en Miraflores"
                state: true
                createdAt: "2026-01-15T08:00:00"
                updatedAt: "2026-06-01T10:30:00"
                deletedAt: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar sucursal
      description: |
        Modifica el nombre y descripción de una sucursal existente.

        **Permisos requeridos:** `estructura-organizacional.crear-editar-sedes` (`administrador_tenant` siempre
        pasa).
      operationId: updateBranch
      tags: [Branches]
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
            example:
              name: "Sede Central Lima – Renovada"
              description: "Oficina renovada en San Isidro"
      responses:
        "200":
          description: Sucursal actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Eliminar sucursal (soft delete)
      description: |
        Marca la sucursal como eliminada (`state = false`, `deleted_at = now`).
        Las áreas y departamentos asociados no se eliminan automáticamente.

        **Permisos requeridos:** `estructura-organizacional.crear-editar-sedes` (`administrador_tenant` siempre
        pasa).
      operationId: deleteBranch
      tags: [Branches]
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        "204":
          description: Sucursal eliminada exitosamente.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /org/areas:
    get:
      summary: Listar áreas
      description: |
        Retorna todas las áreas del tenant. Filtrable por sucursal con
        `branchId` o por estado con `active`.

        **Permisos requeridos:** `VER_ESTRUCTURA` (`administrador_tenant` siempre pasa).
      operationId: listAreas
      tags: [Areas]
      parameters:
        - name: branchId
          in: query
          required: false
          description: Filtra áreas pertenecientes a una sucursal específica.
          schema:
            type: integer
            example: 1
        - name: active
          in: query
          required: false
          description: Si es `true`, retorna solo áreas con `state = true`.
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de áreas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AreaResponse'
              example:
                - id: 2
                  branchId: 1
                  name: "Recursos Humanos"
                  description: "Gestión del talento"
                  state: true
                  createdAt: "2026-01-20T09:00:00"
                  updatedAt: "2026-06-10T11:00:00"
                  deletedAt: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Crear área
      description: |
        Registra una nueva área asociada a una sucursal. El nombre debe ser
        único dentro de la misma sucursal.

        **Permisos requeridos:** `estructura-organizacional.crear-editar-areas` (`administrador_tenant` siempre
        pasa).
      operationId: createArea
      tags: [Areas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaRequest'
            example:
              branchId: 1
              name: "Recursos Humanos"
              description: "Gestión del talento y bienestar laboral"
      responses:
        "201":
          description: Área creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
              example:
                id: 2
                branchId: 1
                name: "Recursos Humanos"
                description: "Gestión del talento y bienestar laboral"
                state: true
                createdAt: "2026-06-27T10:00:00"
                updatedAt: "2026-06-27T10:00:00"
                deletedAt: null
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: La sucursal referenciada (`branchId`) no existe.
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /org/areas/{id}:
    get:
      summary: Obtener área por ID
      description: |
