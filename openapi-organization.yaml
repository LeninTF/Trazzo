      description: |
        Elimina el permiso de forma permanente. Las relaciones
        `role_permissions` que lo referencien se eliminan en cascada
        (`ON DELETE CASCADE` en la FK).

        **Permisos requeridos:** solo `administrador_tenant`.
      operationId: deletePermission
      tags: [Permissions]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        "204":
          description: Permiso eliminado exitosamente.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # USER ASSIGNMENTS (Asignaciones de usuarios)
  # ============================================================================

  /org/users/{tenantUserId}/roles:
    get:
      summary: Listar roles de un usuario
      description: |
        Retorna todas las asignaciones usuario-rol de un `tenant_user`.
        Cada asignación puede tener un `departmentId` que limita el scope del rol.

        **Permisos requeridos:** `gestion-trabajadores.asignar-roles` (`administrador_tenant` siempre pasa).
      operationId: listUserRoles
      tags: [UserAssignments]
      parameters:
        - $ref: '#/components/parameters/TenantUserId'
      responses:
        "200":
          description: Lista de asignaciones usuario-rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleAssignmentResponse'
              example:
                - id: 3
                  tenantUserId: 10
                  roleId: "c1d2e3f4-0000-0000-0000-000000000001"
                  departmentId: 3
                  createdAt: "2026-01-15T08:00:00"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      summary: Asignar rol a usuario
      description: |
        Crea una fila en `tenant_user_role`. El campo `departmentId` es opcional
        y limita el scope del rol a un departamento específico. Si se omite,
        el rol aplica a todo el tenant.

        **Permisos requeridos:** `gestion-trabajadores.asignar-roles` (`administrador_tenant` siempre pasa).
      operationId: assignRoleToUser
      tags: [UserAssignments]
      parameters:
        - $ref: '#/components/parameters/TenantUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleToUserRequest'
            example:
              roleId: "c1d2e3f4-0000-0000-0000-000000000001"
              departmentId: 3
      responses:
        "201":
          description: Rol asignado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleAssignmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: El usuario, rol o departamento no existe.
          $ref: '#/components/responses/NotFound'
        "409":
          description: El usuario ya tiene ese rol asignado (con el mismo scope).
          $ref: '#/components/responses/Conflict'

  /org/users/{tenantUserId}/roles/{assignmentId}:
    delete:
      summary: Remover rol de usuario
      description: |
        Elimina la asignación `tenant_user_role` de forma permanente.

        **Permisos requeridos:** `gestion-trabajadores.asignar-roles` (`administrador_tenant` siempre pasa).
      operationId: removeRoleFromUser
      tags: [UserAssignments]
      parameters:
        - $ref: '#/components/parameters/TenantUserId'
        - $ref: '#/components/parameters/UserRoleAssignmentId'
      responses:
        "204":
          description: Asignación de rol eliminada exitosamente.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /org/roles/{roleId}/users:
    get:
      summary: Listar usuarios con un rol
      description: |
        Retorna todas las asignaciones de usuarios que tienen el rol especificado.

        **Permisos requeridos:** `gestion-trabajadores.asignar-roles` (`administrador_tenant` siempre pasa).
      operationId: listRoleUsers
      tags: [UserAssignments]
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        "200":
          description: Lista de asignaciones usuario-rol para este rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleAssignmentResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

tags:
  - name: Branches
    description: |
      Gestión de sucursales (`branch`). Son el nivel más alto de la jerarquía
      organizacional. Cada tenant puede tener múltiples sucursales.
  - name: Areas
    description: |
      Gestión de áreas (`area`). Cada área pertenece a una sucursal.
      El nombre de un área debe ser único dentro de su sucursal.
  - name: Departments
    description: |
      Gestión de departamentos (`department`). Cada departamento pertenece a
      un área. El nombre debe ser único dentro de su área. Los `tenant_user`
      se asignan a departamentos.
  - name: Roles
    description: |
      Catálogo de roles RBAC (`role`). Un rol agrupa un conjunto de permisos.
      Los usuarios del tenant (`tenant_user`) reciben roles mediante
      `tenant_user_role`, opcionalmente con scope a un departamento.
  - name: Permissions
    description: |
      Catálogo de permisos RBAC (`permissions`). Cada permiso representa una
      acción sobre un recurso (ej. `employees:read`). Los permisos pueden estar
      condicionados a una feature de la suscripción via `masterFeaturesCode`.
  - name: UserAssignments
    description: |
      Asignaciones de usuarios a la estructura organizacional y a roles.
      Gestiona las tablas `tenant_user_department` y `tenant_user_role`.
      Un usuario puede pertenecer a múltiples departamentos (`isPrimary` marca
      el principal) y recibir múltiples roles, cada uno opcionalmente con scope
      a un departamento específico.
