          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar rol
      description: |
        **Permisos requeridos:** solo `administrador_tenant`.
      operationId: updateRole
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
            example:
              name: "Jefe de RRHH"
              description: "Responsable del área de recursos humanos"
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Eliminar rol
      description: |
        Elimina el rol de forma permanente. Fallará si el rol tiene usuarios
        asignados (`tenant_user_role`). Desasignar usuarios antes de eliminar.

        **Permisos requeridos:** solo `administrador_tenant`.
      operationId: deleteRole
      tags: [Roles]
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        "204":
          description: Rol eliminado exitosamente.
        "400":
          description: No se puede eliminar el rol porque tiene usuarios asignados.
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /org/roles/{roleId}/permissions:
    get:
      summary: Listar permisos de un rol
      description: |
        Retorna todos los permisos asignados al rol especificado.

        **Permisos requeridos:** `gestion-trabajadores.asignar-roles` (`administrador_tenant` siempre pasa).
      operationId: listRolePermissions
