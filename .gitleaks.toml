title = "Gitleaks Configuration"

# Allowlist para findings ya remediados en commits posteriores.
# No agregar aquí secrets activos — solo commits donde el secret
# fue introducido Y removido en el commit inmediatamente siguiente.
[allowlist]
  description = "Secrets already removed in follow-up commits; test-only fixtures"
  commits = [
    "3d1d4df39abff57da86fa74258e79b2e0b5bec25", # app.jwt.secret removido en 21ac626
  ]
  # Vector de interoperabilidad .NET -> Java: clave RSA generada solo para tests (ver el README de la carpeta).
  paths = [
    '''back/src/test/resources/biometric/dotnet-interop-vector\.json''',
  ]
