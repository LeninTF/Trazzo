name: Publish Docker Images

# Solo se publica lo que ya pasó su CI en main (AUD-13): este workflow corre cuando termina el CI del
# backend o del frontend, y construye exactamente el commit que ese CI probó (head_sha), no el último de main.
on:
  workflow_run:
    workflows: ["CI/CD Backend Spring Boot", "CI/CD Frontend Angular"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Elegir la imagen según el CI que terminó
        id: target
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$WORKFLOW" in
            "CI/CD Backend Spring Boot") echo "component=back" >> "$GITHUB_OUTPUT" ;;
            "CI/CD Frontend Angular") echo "component=front" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::CI inesperado: $WORKFLOW"; exit 1 ;;
          esac
          echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (etiquetas) para Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Las etiquetas OCI (revision) salen del checkout de head_sha, no de github.sha.
          context: git
          images: ghcr.io/${{ github.repository }}/trazzo-${{ steps.target.outputs.component }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ steps.target.outputs.short_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y empujar la imagen
        uses: docker/build-push-action@v7
        with:
          context: ./${{ steps.target.outputs.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.target.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.component }}
